packages:
  - "app/*"
  - "packages/*"
  - "infra"

# Shared dependency versions for all workspace packages.
catalog:
  '@hono/aws-lambda': ^1.0.0
  '@swc/core': ^1.15.0
  '@swc/jest': ^0.2.39
  '@tailwindcss/postcss': ^4
  '@types/jest': ^30
  '@types/node': ^24.10.1
  '@types/react': ^19
  '@types/react-dom': ^19
  aws-cdk: 2.1144.0
  aws-cdk-lib: ^2.271.0
  babel-plugin-react-compiler: 1.0.0
  constructs: ^10.5.0
  esbuild: ^0.28.2
  eslint: ^9
  eslint-config-next: 16.3.8
  hono: ^4.13.12
  jest: ^30
  next: 16.3.8
  react: 19.2.8
  react-dom: 19.2.8
  tailwindcss: ^4
  tsx: ^4.23.0
  turbo: ^2.11.6
  typescript: ~7.0.2

# Keep the web app's existing compiler and Node typings.
catalogs:
  web:
    '@types/node': ^20
    typescript: ^5

catalogMode: prefer

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  sharp: false
  unrs-resolver: true
